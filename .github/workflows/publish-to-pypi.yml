name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.8"
      - name: Check release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as project_file:
              project = tomllib.load(project_file)["project"]

          assert project["name"] == "redaction-mcp", "Unexpected package name"
          expected_tag = f"v{project['version']}"
          assert os.environ["RELEASE_TAG"] == expected_tag, (
              f"Tag must be {expected_tag} for this version"
          )
          PY
      - name: Install test and build dependencies
        run: python -m pip install -e ".[dev]" build twine
      - name: Run tests
        run: python -m pytest --cov=src --cov-report=term
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/redaction-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
