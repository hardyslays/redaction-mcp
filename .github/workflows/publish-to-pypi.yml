name: Publish to PyPI

on:
  pull_request:
    types: [closed]
    branches:
      - "release-*"

permissions:
  contents: read

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.8"
      - name: Check release branch and version
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib

          with open("pyproject.toml", "rb") as project_file:
              project = tomllib.load(project_file)["project"]

          assert project["name"] == "redaction-mcp", "Unexpected package name"
          release_branch = os.environ["RELEASE_BRANCH"]
          assert re.fullmatch(r"release-\d+\.\d+\.\d+", release_branch), (
              "Release branch must be named release-<major>.<minor>.<patch>"
          )
          expected_branch = f"release-{project['version']}"
          assert release_branch == expected_branch, (
              f"Branch must be {expected_branch} for this version"
          )
          PY
      - name: Install test and build dependencies
        run: python -m pip install -e ".[dev]" build twine
      - name: Run tests
        run: python -m pytest --cov=src --cov-report=term
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/redaction-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
